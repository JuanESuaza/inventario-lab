# proxy/default.conf — Nginx (imagen sin privilegios) como única puerta de entrada al stack.
# Termina TLS, aplica cabeceras de seguridad y limita intentos de login. Reenvía a app:8000
# por la red "frontend"; nunca ve la base de datos (no está en la red "backend").
server_tokens off;

# Solo los intentos de autenticación (POST /login) cuentan para el límite: 10 por minuto por IP
map $request_method $clave_login { POST $binary_remote_addr; default ""; }
limit_req_zone $clave_login zone=login:10m rate=10r/m;

log_format principal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time upstream=$upstream_addr ustatus=$upstream_status';

# DNS interno de Docker: re-resolver "app" si el contenedor cambia de IP al reiniciarse
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    access_log /dev/stdout principal;
    error_log  /dev/stderr warn;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    set $backend http://app:8000;

    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}

# Solo para el healthcheck del contenedor: escucha en 127.0.0.1 (no se publica ni sale del contenedor)
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /salud { return 200 "ok\n"; }
}
