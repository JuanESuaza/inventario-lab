{% extends "base.html" %}
{% block contenido %}
<h1>{{ titulo }}</h1>
{% for e in errores %}<p class="aviso">{{ e }}</p>{% endfor %}
<form method="post" class="tarjeta">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>Código <input name="codigo" value="{{ datos.codigo or '' }}" required></label>
  <label>Nombre <input name="nombre" value="{{ datos.nombre or '' }}" required></label>
  <label>Categoría
    <select name="categoria">{% for c in categorias %}<option {% if datos.categoria == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
  </label>
  <label>Ubicación <input name="ubicacion" value="{{ datos.ubicacion or '' }}" required></label>
  <label>Estado
    <select name="estado">{% for s in estados %}<option {% if datos.estado == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
  </label>
  <label>Responsable <input name="responsable" value="{{ datos.responsable or '' }}"></label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
